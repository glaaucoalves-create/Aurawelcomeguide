  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

background:#F7F4EE;border-radius:16px;padding:16px 6px 11px;display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer\" style-hover=\"background:#FFFFFF\">\n                <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 30 30\" fill=\"none\"><circle cx=\"15\" cy=\"15\" r=\"10\" stroke=\"#4A4E44\" stroke-width=\"1.3\"><\u002Fcircle><path d=\"M18.5 11.5l-2 5-5 2 2-5z\" stroke=\"#4A4E44\" stroke-width=\"1.3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <span style=\"font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:#4A4E44;text-align:center;line-height:1.4\">o que fazer<\u002Fspan>\n              <\u002Fdiv>\n\n              <div sc-camel-on-click=\"{{ goEmergency }}\" style=\"background:#F7F4EE;border-radius:16px;padding:16px 6px 11px;display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer\" style-hover=\"background:#FFFFFF\">\n                <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 30 30\" fill=\"none\"><circle cx=\"15\" cy=\"15\" r=\"10\" stroke=\"#4A4E44\" stroke-width=\"1.3\"><\u002Fcircle><path d=\"M15 9v8\" stroke=\"#4A4E44\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"15\" cy=\"20.5\" r=\"1.1\" fill=\"#4A4E44\"><\u002Fcircle><\u002Fsvg>\n                <span style=\"font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:#4A4E44;text-align:center;line-height:1.4\">emergência<\u002Fspan>\n              <\u002Fdiv>\n\n              <div sc-camel-on-click=\"{{ goAbout }}\" style=\"background:#F7F4EE;border-radius:16px;padding:16px 6px 11px;display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer\" style-hover=\"background:#FFFFFF\">\n                <img src=\"f9505774-1ee9-481a-a50d-e8aa214b0fe6\" alt=\"\" style=\"width:30px;height:30px;object-fit:contain;display:block\">\n                <span style=\"font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:#4A4E44;text-align:center;line-height:1.4\">a cabana<\u002Fspan>\n              <\u002Fdiv>\n\n              <div sc-camel-on-click=\"{{ goBefore }}\" style=\"background:#F7F4EE;border-radius:16px;padding:16px 6px 11px;display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer\" style-hover=\"background:#FFFFFF\">\n                <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 30 30\" fill=\"none\"><rect x=\"7\" y=\"7\" width=\"16\" height=\"16\" rx=\"3\" stroke=\"#4A4E44\" stroke-width=\"1.3\"><\u002Frect><path d=\"M11 15l3 3 5-6\" stroke=\"#4A4E44\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <span style=\"font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:#4A4E44;text-align:center;line-height:1.4\">antes de ir<\u002Fspan>\n              <\u002Fdiv>\n\n              <div sc-camel-on-click=\"{{ goContact }}\" style=\"background:#F7F4EE;border-radius:16px;padding:16px 6px 11px;display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer\" style-hover=\"background:#FFFFFF\">\n                <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 30 30\" fill=\"none\"><path d=\"M8 8h5l2 5-3 2a11 11 0 0 0 5 5l2-3 5 2v5c0 1-1 2-2 2A17 17 0 0 1 6 10c0-1 1-2 2-2z\" stroke=\"#4A4E44\" stroke-width=\"1.3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <span style=\"font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:#4A4E44;text-align:center;line-height:1.4\">contato<\u002Fspan>\n              <\u002Fdiv>\n\n            <\u002Fdiv>\n            <div sc-camel-on-click=\"{{ goHost }}\" style=\"margin-top:14px;background:rgba(247,244,238,.32);border:1px solid rgba(255,255,255,.5);border-radius:16px;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer\" style-hover=\"background:rgba(247,244,238,.5)\">\n              <span style=\"font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:#FFFFFF\">mensagem dos anfitriões<\u002Fspan>\n              <span style=\"color:#FFFFFF;font-size:15px\">→<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isHost }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"min-height:844px;background:#F7F4EE;padding:64px 0 110px;animation:auraIn .45s ease both\">\n            <div style=\"text-align:center;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:#8A8578\">mensagem dos anfitriões<\u002Fdiv>\n            <div style=\"margin:20px 24px 0;height:230px;border-radius:22px;background:repeating-linear-gradient(135deg,#E6E0D4 0 10px,#DCD4C4 10px 20px);display:flex;align-items:center;justify-content:center\">\n              <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#8A8578\">foto: varanda / vista<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding:30px 30px 0\">\n              <div style=\"font-family:'Poiret One',cursive;font-size:36px;letter-spacing:.06em;color:#C1571C;line-height:1.15\">Que bom<br>ter você aqui<\u002Fdiv>\n              <div style=\"font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#96AF95;margin-top:10px\">a warm welcome<\u002Fdiv>\n              <p style=\"font-weight:300;font-size:13.5px;line-height:1.85;color:#4A4E44;margin:22px 0 0;text-wrap:pretty\">A AURA nasceu de uma vontade simples: criar um lugar onde o tempo desacelera. Aqui na PRANA Experience acreditamos que respirar fundo, ouvir o rio e não ter pressa já é motivo suficiente para uma viagem.<\u002Fp>\n              <p style=\"font-weight:300;font-size:13.5px;line-height:1.85;color:#4A4E44;margin:14px 0 0;text-wrap:pretty\">Preparamos cada canto pensando no seu descanso. Se precisar de qualquer coisa — uma dica, um cobertor a mais, uma indicação de trilha — é só chamar. Estamos por perto.<\u002Fp>\n              <p style=\"font-weight:300;font-size:11.5px;line-height:1.8;color:#8A8578;margin:16px 0 0;font-style:italic;text-wrap:pretty\">AURA was born from a simple wish: a place where time slows down. Anything you need during your stay, just reach out — we are nearby.<\u002Fp>\n              <div style=\"margin-top:26px;font-family:'Poiret One',cursive;font-size:26px;color:#C1571C\">[assinatura dos anfitriões]<\u002Fdiv>\n              <div style=\"font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#8A8578;margin-top:6px\">prana experience<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"min-height:844px;background:#F7F4EE;padding:64px 0 110px;animation:auraIn .45s ease both\">\n            <div style=\"text-align:center;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:#8A8578\">a cabana<\u002Fdiv>\n            <div style=\"margin:20px 24px 0;height:210px;border-radius:22px 22px 120px 120px;background:repeating-linear-gradient(135deg,#E6E0D4 0 10px,#DCD4C4 10px 20px);display:flex;align-items:center;justify-content:center\">\n              <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#8A8578\">foto: interior da AURA<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding:28px 30px 0;text-align:center\">\n              <img src=\"aac04267-de8b-4400-8ad2-b4c48aa5bf36\" alt=\"AURA\" style=\"width:170px;height:auto;display:block;margin:0 auto\">\n              <div style=\"font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:#8A8578;margin-top:8px\">natureza · silêncio · descanso<\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"padding:0 30px;font-weight:300;font-size:13.5px;line-height:1.85;color:#4A4E44;margin:22px 0 0;text-wrap:pretty\">Uma cabana pensada para dois, cercada de mata e do som do rio de Lumiar. Madeira, luz natural e o mínimo necessário — porque aqui o que sobra é paisagem.<\u002Fp>\n            <p style=\"padding:0 30px;font-weight:300;font-size:13.5px;line-height:1.85;color:#4A4E44;margin:14px 0 0;text-wrap:pretty\">A AURA faz parte da PRANA Experience, ao lado da casa PRANA, do domo OJAS e do chalé MANTRA. Cada espaço tem seu ritmo; o da AURA é o mais recolhido.<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:24px 30px 0\">\n              <div style=\"height:78px;border-radius:14px;background:repeating-linear-gradient(135deg,#E6E0D4 0 8px,#DCD4C4 8px 16px)\"><\u002Fdiv>\n              <div style=\"height:78px;border-radius:14px;background:repeating-linear-gradient(135deg,#E6E0D4 0 8px,#DCD4C4 8px 16px)\"><\u002Fdiv>\n              <div style=\"height:78px;border-radius:14px;background:repeating-linear-gradient(135deg,#E6E0D4 0 8px,#DCD4C4 8px 16px)\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:9.5px;color:#8A8578;margin-top:8px\">3 fotos de detalhe<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isCheckin }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"min-height:844px;background:#F7F4EE;padding:64px 30px 110px;animation:auraIn .45s ease both\">\n            <div style=\"text-align:center;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:#8A8578\">chegada e saída<\u002Fdiv>\n            <div style=\"text-align:center;font-family:'Poiret One',cursive;font-size:38px;color:#C1571C;margin-top:12px\">check-in / out<\u002Fdiv>\n            <div style=\"display:flex;gap:12px;margin-top:26px\">\n              <div style=\"flex:1;background:#96AF95;border-radius:20px;padding:22px 16px;text-align:center;color:#fff\">\n                <div style=\"font-size:9px;letter-spacing:.24em;text-transform:uppercase;opacity:.9\">check-in<\u002Fdiv>\n                <div style=\"font-family:'Poiret One',cursive;font-size:34px;margin-top:8px\">[15h]<\u002Fdiv>\n                <div style=\"font-size:10px;font-weight:300;opacity:.9;margin-top:4px\">from 3 pm<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;background:#CFBB9E;border-radius:20px;padding:22px 16px;text-align:center;color:#4A4E44\">\n                <div style=\"font-size:9px;letter-spacing:.24em;text-transform:uppercase;opacity:.8\">check-out<\u002Fdiv>\n                <div style=\"font-family:'Poiret One',cursive;font-size:34px;margin-top:8px\">[11h]<\u002Fdiv>\n                <div style=\"font-size:10px;font-weight:300;opacity:.8;margin-top:4px\">until 11 am<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:26px;display:flex;flex-direction:column;gap:16px\">\n              <div>\n                <div style=\"font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#C1571C\">como entrar · access<\u002Fdiv>\n                <p style=\"margin:8px 0 0;font-weight:300;font-size:13px;line-height:1.8;color:#4A4E44;text-wrap:pretty\">[Descreva aqui: portão, cadeado/senha, onde fica a chave, se há recepção.] Enviamos as instruções também por WhatsApp no dia da sua chegada.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"height:1px;background:rgba(51,55,47,.1)\"><\u002Fdiv>\n              <div>\n                <div style=\"font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#C1571C\">chegada antecipada<\u002Fdiv>\n                <p style=\"margin:8px 0 0;font-weight:300;font-size:13px;line-height:1.8;color:#4A4E44;text-wrap:pretty\">Pode consultar disponibilidade — quando a cabana está livre, liberamos sem custo. Vale o mesmo para o late check-out.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"height:1px;background:rgba(51,55,47,.1)\"><\u002Fdiv>\n              <div>\n                <div style=\"font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#C1571C\">na saída<\u002Fdiv>\n                <p style=\"margin:8px 0 0;font-weight:300;font-size:13px;line-height:1.8;color:#4A4E44;text-wrap:pretty\">Deixe as chaves [onde] e as janelas fechadas. Não precisa lavar louça nem tirar a roupa de cama.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isWifi }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"min-height:844px;background:#96AF95;padding:74px 30px 110px;display:flex;flex-direction:column;animation:auraIn .45s ease both\">\n            <div style=\"text-align:center\">\n              <div style=\"font-family:'Poiret One',cursive;font-size:52px;letter-spacing:.1em;color:#FFFFFF;padding-left:.1em\">wi-fi<\u002Fdiv>\n              <div style=\"font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:#F0EDE4;margin-top:6px\">conecte-se · stay connected<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:34px;display:flex;flex-direction:column;gap:14px\">\n              <div style=\"background:#F7F4EE;border-radius:100px;padding:16px 24px;text-align:center\">\n                <div style=\"font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;color:#8A8578\">rede · network<\u002Fdiv>\n                <div style=\"font-family:'Poiret One',cursive;font-size:26px;color:#4A4E44;margin-top:2px\">[AURA_PRANA]<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#F7F4EE;border-radius:100px;padding:16px 24px;text-align:center\">\n                <div style=\"font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;color:#8A8578\">senha · password<\u002Fdiv>\n                <div style=\"font-family:'Poiret One',cursive;font-size:26px;color:#4A4E44;margin-top:2px\">[inserir senha]<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:30px 0 0;font-weight:300;font-size:13px;line-height:1.9;color:#FFFFFF;text-align:center;text-wrap:pretty\">Estamos na serra: o sinal é bom para mensagens e streaming, mas pode oscilar em dias de chuva forte. Se cair, desligue o roteador da tomada por 30 segundos.<\u002Fp>\n            <p style=\"margin:14px 0 0;font-weight:300;font-size:11px;line-height:1.8;color:#F0EDE4;text-align:center;font-style:italic;text-wrap:pretty\">Mountain signal may fluctuate in heavy rain — unplug the router for 30s to reset.<\u002Fp>\n            <div style=\"margin:34px auto 0;width:112px;height:112px;border-radius:16px;background:repeating-linear-gradient(135deg,#E6E0D4 0 8px,#DCD4C4 8px 16px);display:flex;align-items:center;justify-content:center\">\n              <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:9px;color:#8A8578;text-align:center\">QR<br>wi-fi<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isRules }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"min-height:844px;background:#F7F4EE;padding:64px 30px 110px;animation:auraIn .45s ease both\">\n            <div style=\"text-align:center;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:#8A8578\">para todos ficarem bem<\u002Fdiv>\n            <div style=\"text-align:center;font-family:'Poiret One',cursive;font-size:40px;color:#C1571C;margin-top:12px\">regras da casa<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:0;margin-top:26px\">\n              <div style=\"display:flex;gap:16px;padding:16px 0;border-bottom:1px solid rgba(51,55,47,.1)\">\n                <span style=\"font-family:'Poiret One',cursive;font-size:20px;color:#96AF95;min-width:22px\">01<\u002Fspan>\n                <div><div style=\"font-size:13px;font-weight:400;color:#4A4E44\">Silêncio a partir das 22h<\u002Fdiv><div style=\"font-size:11px;font-weight:300;color:#8A8578;margin-top:3px\">Quiet hours from 10 pm · o som do rio é a trilha oficial<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:16px;padding:16px 0;border-bottom:1px solid rgba(51,55,47,.1)\">\n                <span style=\"font-family:'Poiret One',cursive;font-size:20px;color:#96AF95;min-width:22px\">02<\u002Fspan>\n                <div><div style=\"font-size:13px;font-weight:400;color:#4A4E44\">Não é permitido fumar dentro da cabana<\u002Fdiv><div style=\"font-size:11px;font-weight:300;color:#8A8578;margin-top:3px\">No smoking indoors · use a área externa e descarte com cuidado<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:16px;padding:16px 0;border-bottom:1px solid rgba(51,55,47,.1)\">\n                <span style=\"font-family:'Poiret One',cursive;font-size:20px;color:#96AF95;min-width:22px\">03<\u002Fspan>\n                <div><div style=\"font-size:13px;font-weight:400;color:#4A4E44\">Sem festas ou visitantes não avisados<\u002Fdiv><div style=\"font-size:11px;font-weight:300;color:#8A8578;margin-top:3px\">No parties · a cabana acomoda [2] hóspedes<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:16px;padding:16px 0;border-bottom:1px solid rgba(51,55,47,.1)\">\n                <span style=\"font-family:'Poiret One',cursive;font-size:20px;color:#96AF95;min-width:22px\">04<\u002Fspan>\n                <div><div style=\"font-size:13px;font-weight:400;color:#4A4E44\">Pets: [consultar antes]<\u002Fdiv><div style=\"font-size:11px;font-weight:300;color:#8A8578;margin-top:3px\">Pets on request<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:16px;padding:16px 0;border-bottom:1px solid rgba(51,55,47,.1)\">\n                <span style=\"font-family:'Poiret One',cursive;font-size:20px;color:#96AF95;min-width:22px\">05<\u002Fspan>\n                <div><div style=\"font-size:13px;font-weight:400;color:#4A4E44\">Fogo apenas nos locais indicados<\u002Fdiv><div style=\"font-size:11px;font-weight:300;color:#8A8578;margin-top:3px\">Velas, lareira e fogueira sempre supervisionadas<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:16px;padding:16px 0\">\n                <span style=\"font-family:'Poiret One',cursive;font-size:20px;color:#96AF95;min-width:22px\">06<\u002Fspan>\n                <div><div style=\"font-size:13px;font-weight:400;color:#4A4E44\">Leve seu lixo até o ponto de coleta<\u002Fdiv><div style=\"font-size:11px;font-weight:300;color:#8A8578;margin-top:3px\">Separe recicláveis — a serra agradece<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:20px;background:#EFE9DE;border-radius:18px;padding:18px 20px\">\n              <p style=\"margin:0;font-weight:300;font-size:12px;line-height:1.8;color:#4A4E44;text-wrap:pretty\">Nada aqui é burocracia — é só o combinado que mantém a AURA tranquila para quem chega depois de você.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isAmenities }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"min-height:844px;background:#F7F4EE;padding:64px 30px 110px;animation:auraIn .45s ease both\">\n            <div style=\"text-align:center;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:#8A8578\">o que você encontra<\u002Fdiv>\n            <div style=\"text-align:center;font-family:'Poiret One',cursive;font-size:40px;color:#C1571C;margin-top:12px\">comodidades<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px\">\n              <div style=\"background:#EFE9DE;border-radius:16px;padding:16px 14px\"><div style=\"font-size:12.5px;color:#4A4E44\">Roupa de cama e toalhas<\u002Fdiv><div style=\"font-size:10px;font-weight:300;color:#8A8578;margin-top:3px\">Linen &amp; towels<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#EFE9DE;border-radius:16px;padding:16px 14px\"><div style=\"font-size:12.5px;color:#4A4E44\">Cozinha equipada<\u002Fdiv><div style=\"font-size:10px;font-weight:300;color:#8A8578;margin-top:3px\">Kitchen<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#EFE9DE;border-radius:16px;padding:16px 14px\"><div style=\"font-size:12.5px;color:#4A4E44\">Café, chá e temperos<\u002Fdiv><div style=\"font-size:10px;font-weight:300;color:#8A8578;margin-top:3px\">Coffee &amp; tea<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#EFE9DE;border-radius:16px;padding:16px 14px\"><div style=\"font-size:12.5px;color:#4A4E44\">Aquecedor / lareira<\u002Fdiv><div style=\"font-size:10px;font-weight:300;color:#8A8578;margin-top:3px\">Heating<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#EFE9DE;border-radius:16px;padding:16px 14px\"><div style=\"font-size:12.5px;color:#4A4E44\">Chuveiro quente<\u002Fdiv><div style=\"font-size:10px;font-weight:300;color:#8A8578;margin-top:3px\">Hot shower<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#EFE9DE;border-radius:16px;padding:16px 14px\"><div style=\"font-size:12.5px;color:#4A4E44\">Varanda com rede<\u002Fdiv><div style=\"font-size:10px;font-weight:300;color:#8A8578;margin-top:3px\">Porch &amp; hammock<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#EFE9DE;border-radius:16px;padding:16px 14px\"><div style=\"font-size:12.5px;color:#4A4E44\">Estacionamento<\u002Fdiv><div style=\"font-size:10px;font-weight:300;color:#8A8578;margin-top:3px\">Parking<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#EFE9DE;border-radius:16px;padding:16px 14px\"><div style=\"font-size:12.5px;color:#4A4E44\">Kit de primeiros socorros<\u002Fdiv><div style=\"font-size:10px;font-weight:300;color:#8A8578;margin-top:3px\">First aid<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:22px;background:#96AF95;border-radius:20px;padding:20px 22px;color:#fff\">\n              <div style=\"font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;opacity:.9\">extras PRANA<\u002Fdiv>\n              <p style=\"margin:10px 0 0;font-weight:300;font-size:12.5px;line-height:1.8;text-wrap:pretty\">[Liste aqui o que é sob consulta: banheira/ofurô, massagem, café da manhã, aluguel de bike, experiências de yoga e meditação.]<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isHouse }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"min-height:844px;background:#F7F4EE;padding:64px 30px 110px;animation:auraIn .45s ease both\">\n            <div style=\"text-align:center;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:#8A8578\">como usar a cabana<\u002Fdiv>\n            <div style=\"text-align:center;font-family:'Poiret One',cursive;font-size:40px;color:#C1571C;margin-top:12px\">guia da casa<\u002Fdiv>\n            <div style=\"margin-top:26px;display:flex;flex-direction:column;gap:12px\">\n              <div style=\"border:1px solid rgba(51,55,47,.12);border-radius:18px;padding:18px 20px\">\n                <div style=\"font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#96AF95\">aquecimento · heating<\u002Fdiv>\n                <p style=\"margin:8px 0 0;font-weight:300;font-size:12.5px;line-height:1.8;color:#4A4E44;text-wrap:pretty\">[Como ligar o aquecedor / acender a lareira. Onde está a lenha.]<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"border:1px solid rgba(51,55,47,.12);border-radius:18px;padding:18px 20px\">\n                <div style=\"font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#96AF95\">chuveiro e água quente<\u002Fdiv>\n                <p style=\"margin:8px 0 0;font-weight:300;font-size:12.5px;line-height:1.8;color:#4A4E44;text-wrap:pretty\">[Tipo de aquecimento, tempo de espera, dicas de economia de água.]<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"border:1px solid rgba(51,55,47,.12);border-radius:18px;padding:18px 20px\">\n                <div style=\"font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#96AF95\">cozinha<\u002Fdiv>\n                <p style=\"margin:8px 0 0;font-weight:300;font-size:12.5px;line-height:1.8;color:#4A4E44;text-wrap:pretty\">[Fogão/cooktop, gás, cafeteira — como usar. O que pode consumir à vontade.]<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"border:1px solid rgba(51,55,47,.12);border-radius:18px;padding:18px 20px\">\n                <div style=\"font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#96AF95\">energia e luzes<\u002Fdiv>\n                <p style=\"margin:8px 0 0;font-weight:300;font-size:12.5px;line-height:1.8;color:#4A4E44;text-wrap:pretty\">[Onde fica o quadro de luz. O que fazer se faltar energia — comum na serra em temporais.]<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"border:1px solid rgba(51,55,47,.12);border-radius:18px;padding:18px 20px\">\n                <div style=\"font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#96AF95\">lixo e reciclagem<\u002Fdiv>\n                <p style=\"margin:8px 0 0;font-weight:300;font-size:12.5px;line-height:1.8;color:#4A4E44;text-wrap:pretty\">[Onde deixar, dias de coleta.]<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isTransport }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"min-height:844px;background:#F7F4EE;padding:64px 30px 110px;animation:auraIn .45s ease both\">\n            <div style=\"text-align:center;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:#8A8578\">deslocamento<\u002Fdiv>\n            <div style=\"text-align:center;font-family:'Poiret One',cursive;font-size:40px;color:#C1571C;margin-top:12px\">como chegar<\u002Fdiv>\n            <div style=\"margin-top:22px;height:170px;border-radius:20px;background:repeating-linear-gradient(135deg,#E6E0D4 0 10px,#DCD4C4 10px 20px);display:flex;align-items:center;justify-content:center\">\n              <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#8A8578\">mapa / print do Google Maps<\u002Fspan>\n            <\u002Fdiv>\n            <a href=\"https://maps.google.com/?q=cabana+aura+lumiar\" target=\"_blank\" style=\"display:block;margin-top:12px;background:#96AF95;border-radius:100px;padding:14px;text-align:center;color:#fff;font-size:10px;letter-spacing:.24em;text-transform:uppercase\">abrir no google maps<\u002Fa>\n            <div style=\"margin-top:24px;display:flex;flex-direction:column;gap:16px\">\n              <div>\n                <div style=\"font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#C1571C\">de carro · by car<\u002Fdiv>\n                <p style=\"margin:8px 0 0;font-weight:300;font-size:12.5px;line-height:1.8;color:#4A4E44;text-wrap:pretty\">Do Rio de Janeiro são cerca de 2h30 a 3h. A estrada final até Lumiar tem trechos de serra sinuosos — dirija com calma e evite chegar depois do escurecer na primeira vez. [Confirmar se o acesso final pede carro alto.]<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"height:1px;background:rgba(51,55,47,.1)\"><\u002Fdiv>\n              <div>\n                <div style=\"font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#C1571C\">ônibus · by bus<\u002Fdiv>\n                <p style=\"margin:8px 0 0;font-weight:300;font-size:12.5px;line-height:1.8;color:#4A4E44;text-wrap:pretty\">Rio → Nova Friburgo (rodoviária) e, de lá, van ou ônibus local até Lumiar. Combine o traslado final com antecedência.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"height:1px;background:rgba(51,55,47,.1)\"><\u002Fdiv>\n              <div>\n                <div style=\"font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#C1571C\">por aqui · getting around<\u002Fdiv>\n                <p style=\"margin:8px 0 0;font-weight:300;font-size:12.5px;line-height:1.8;color:#4A4E44;text-wrap:pretty\">Aplicativos de transporte têm cobertura limitada. Guarde o contato de um taxista local: [nome e telefone].<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isEat }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"min-height:844px;background:#F7F4EE;padding:64px 30px 110px;animation:auraIn .45s ease both\">\n            <div style=\"text-align:center;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:#8A8578\">nossas indicações<\u002Fdiv>\n            <div style=\"text-align:center;font-family:'Poiret One',cursive;font-size:40px;color:#C1571C;margin-top:12px\">onde comer<\u002Fdiv>\n            <div style=\"margin-top:24px;display:flex;flex-direction:column;gap:14px\">\n              <div style=\"display:flex;gap:14px;align-items:center\">\n                <div style=\"width:78px;height:78px;flex:none;border-radius:14px;background:repeating-linear-gradient(135deg,#E6E0D4 0 8px,#DCD4C4 8px 16px)\"><\u002Fdiv>\n                <div><div style=\"font-size:13.5px;color:#4A4E44\">[Restaurante 1]<\u002Fdiv><div style=\"font-size:11px;font-weight:300;color:#8A8578;line-height:1.7;margin-top:3px\">Centrinho de Lumiar · cozinha da serra<br>a 5 min de carro<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:14px;align-items:center\">\n                <div style=\"width:78px;height:78px;flex:none;border-radius:14px;background:repeating-linear-gradient(135deg,#E6E0D4 0 8px,#DCD4C4 8px 16px)\"><\u002Fdiv>\n                <div><div style=\"font-size:13.5px;color:#4A4E44\">[Restaurante 2]<\u002Fdiv><div style=\"font-size:11px;font-weight:300;color:#8A8578;line-height:1.7;margin-top:3px\">Pizza / massas · bom para o jantar<br>reserve nos fins de semana<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:14px;align-items:center\">\n                <div style=\"width:78px;height:78px;flex:none;border-radius:14px;background:repeating-linear-gradient(135deg,#E6E0D4 0 8px,#DCD4C4 8px 16px)\"><\u002Fdiv>\n                <div><div style=\"font-size:13.5px;color:#4A4E44\">[Café / padaria]<\u002Fdiv><div style=\"font-size:11px;font-weight:300;color:#8A8578;line-height:1.7;margin-top:3px\">Pão fresco e café da manhã<br>abre cedo<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:14px;align-items:center\">\n                <div style=\"width:78px;height:78px;flex:none;border-radius:14px;background:repeating-linear-gradient(135deg,#E6E0D4 0 8px,#DCD4C4 8px 16px)\"><\u002Fdiv>\n                <div><div style=\"font-size:13.5px;color:#4A4E44\">[Bar / cervejaria]<\u002Fdiv><div style=\"font-size:11px;font-weight:300;color:#8A8578;line-height:1.7;margin-top:3px\">Para o fim de tarde<br>São Pedro da Serra, 15 min<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:22px;background:#EFE9DE;border-radius:18px;padding:18px 20px\">\n              <div style=\"font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#C1571C\">mercado<\u002Fdiv>\n              <p style=\"margin:8px 0 0;font-weight:300;font-size:12.5px;line-height:1.8;color:#4A4E44;text-wrap:pretty\">O comércio de Lumiar é pequeno e fecha cedo. Se quiser cozinhar, vale trazer o essencial de casa ou parar em Nova Friburgo na vinda.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isExplore }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"min-height:844px;background:#F7F4EE;padding:64px 30px 110px;animation:auraIn .45s ease both\">\n            <div style=\"text-align:center;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:#8A8578\">lumiar e arredores<\u002Fdiv>\n            <div style=\"text-align:center;font-family:'Poiret One',cursive;font-size:40px;color:#C1571C;margin-top:12px\">o que fazer<\u002Fdiv>\n            <div style=\"margin-top:24px;display:flex;flex-direction:column;gap:12px\">\n              <div style=\"border-radius:20px;overflow:hidden;background:#EFE9DE\">\n                <div style=\"height:104px;background:repeating-linear-gradient(135deg,#E6E0D4 0 10px,#DCD4C4 10px 20px)\"><\u002Fdiv>\n                <div style=\"padding:14px 18px 16px\"><div style=\"font-size:13.5px;color:#4A4E44\">Cachoeiras e poços<\u002Fdiv><div style=\"font-size:11.5px;font-weight:300;color:#8A8578;line-height:1.75;margin-top:4px\">A região é famosa por elas. Vá cedo, leve calçado que possa molhar e respeite as sinalizações — o volume de água muda rápido depois da chuva.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border-radius:20px;overflow:hidden;background:#EFE9DE\">\n                <div style=\"height:104px;background:repeating-linear-gradient(135deg,#E6E0D4 0 10px,#DCD4C4 10px 20px)\"><\u002Fdiv>\n                <div style=\"padding:14px 18px 16px\"><div style=\"font-size:13.5px;color:#4A4E44\">Rafting e boia-cross no Rio Macaé<\u002Fdiv><div style=\"font-size:11.5px;font-weight:300;color:#8A8578;line-height:1.75;margin-top:4px\">Operadoras locais saem do centro de Lumiar. Agende com um dia de antecedência.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border-radius:20px;overflow:hidden;background:#EFE9DE\">\n                <div style=\"height:104px;background:repeating-linear-gradient(135deg,#E6E0D4 0 10px,#DCD4C4 10px 20px)\"><\u002Fdiv>\n                <div style=\"padding:14px 18px 16px\"><div style=\"font-size:13.5px;color:#4A4E44\">Trilhas e mirantes<\u002Fdiv><div style=\"font-size:11.5px;font-weight:300;color:#8A8578;line-height:1.75;margin-top:4px\">[Indique 1–2 trilhas próximas e o nível de dificuldade.] Guia local recomendado nas mais longas.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border-radius:20px;overflow:hidden;background:#EFE9DE\">\n                <div style=\"height:104px;background:repeating-linear-gradient(135deg,#E6E0D4 0 10px,#DCD4C4 10px 20px)\"><\u002Fdiv>\n                <div style=\"padding:14px 18px 16px\"><div style=\"font-size:13.5px;color:#4A4E44\">São Pedro da Serra<\u002Fdiv><div style=\"font-size:11.5px;font-weight:300;color:#8A8578;line-height:1.75;margin-top:4px\">Vilarejo vizinho com ateliês, feirinha e vida noturna tranquila. Cerca de 15 min de carro.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isEmergency }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"min-height:844px;background:#C4634A;padding:74px 30px 110px;animation:auraIn .45s ease both\">\n            <div style=\"text-align:center\">\n              <div style=\"font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.8)\">se precisar de ajuda<\u002Fdiv>\n              <div style=\"font-family:'Poiret One',cursive;font-size:42px;color:#FFFFFF;margin-top:10px\">emergência<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:28px;display:flex;flex-direction:column;gap:10px\">\n              <div style=\"background:#F7F4EE;border-radius:16px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center\"><div><div style=\"font-size:12.5px;color:#4A4E44\">SAMU<\u002Fdiv><div style=\"font-size:10px;font-weight:300;color:#8A8578\">ambulância<\u002Fdiv><\u002Fdiv><div style=\"font-family:'Poiret One',cursive;font-size:26px;color:#C4634A\">192<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#F7F4EE;border-radius:16px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center\"><div><div style=\"font-size:12.5px;color:#4A4E44\">Bombeiros<\u002Fdiv><div style=\"font-size:10px;font-weight:300;color:#8A8578\">resgate e incêndio<\u002Fdiv><\u002Fdiv><div style=\"font-family:'Poiret One',cursive;font-size:26px;color:#C4634A\">193<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#F7F4EE;border-radius:16px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center\"><div><div style=\"font-size:12.5px;color:#4A4E44\">Polícia Militar<\u002Fdiv><div style=\"font-size:10px;font-weight:300;color:#8A8578\">emergência<\u002Fdiv><\u002Fdiv><div style=\"font-family:'Poiret One',cursive;font-size:26px;color:#C4634A\">190<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#F7F4EE;border-radius:16px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center\"><div><div style=\"font-size:12.5px;color:#4A4E44\">Anfitrião AURA<\u002Fdiv><div style=\"font-size:10px;font-weight:300;color:#8A8578\">24h durante a estadia<\u002Fdiv><\u002Fdiv><div style=\"font-family:'Poiret One',cursive;font-size:18px;color:#C4634A\">[whatsapp]<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:20px;border:1px solid rgba(255,255,255,.45);border-radius:18px;padding:18px 20px\">\n              <div style=\"font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#fff\">saúde mais próxima<\u002Fdiv>\n              <p style=\"margin:8px 0 0;font-weight:300;font-size:12.5px;line-height:1.8;color:#fff;text-wrap:pretty\">Posto de saúde de Lumiar: [endereço e horário]. Hospital de referência em Nova Friburgo: [nome], cerca de [40] min. Farmácia mais próxima: [nome].<\u002Fp>\n            <\u002Fdiv>\n            <p style=\"margin:18px 0 0;font-weight:300;font-size:11px;line-height:1.8;color:rgba(255,255,255,.85);text-align:center;text-wrap:pretty\">Extintor e kit de primeiros socorros ficam em [local].<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isBefore }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"min-height:844px;background:#CFBB9E;padding:74px 30px 110px;animation:auraIn .45s ease both\">\n            <div style=\"text-align:center\">\n              <div style=\"font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:rgba(74,78,68,.75)\">um último cuidado<\u002Fdiv>\n              <div style=\"font-family:'Poiret One',cursive;font-size:40px;color:#4A4E44;margin-top:10px\">antes de ir<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:28px;display:flex;flex-direction:column;gap:10px\">\n              <div style=\"background:#F7F4EE;border-radius:14px;padding:15px 18px;font-size:12.5px;color:#4A4E44\">Feche janelas e portas<\u002Fdiv>\n              <div style=\"background:#F7F4EE;border-radius:14px;padding:15px 18px;font-size:12.5px;color:#4A4E44\">Desligue aquecedor, luzes e gás<\u002Fdiv>\n              <div style=\"background:#F7F4EE;border-radius:14px;padding:15px 18px;font-size:12.5px;color:#4A4E44\">Leve o lixo até o ponto de coleta<\u002Fdiv>\n              <div style=\"background:#F7F4EE;border-radius:14px;padding:15px 18px;font-size:12.5px;color:#4A4E44\">Deixe a chave em [local combinado]<\u002Fdiv>\n              <div style=\"background:#F7F4EE;border-radius:14px;padding:15px 18px;font-size:12.5px;color:#4A4E44\">Confira carregadores, tomadas e o banheiro<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:26px;background:#96AF95;border-radius:22px;padding:24px 22px;text-align:center;color:#fff\">\n              <div style=\"font-family:'Poiret One',cursive;font-size:26px;line-height:1.3\">Deixe sua avaliação<\u002Fdiv>\n              <p style=\"margin:10px 0 0;font-weight:300;font-size:12px;line-height:1.8;text-wrap:pretty\">Se a AURA fez bem a você, contar isso ajuda muito quem vem depois — e ajuda a gente a seguir cuidando daqui.<\u002Fp>\n              <a href=\"#\" style=\"display:inline-block;margin-top:14px;background:#fff;color:#6F8B6E;border-radius:100px;padding:12px 26px;font-size:10px;letter-spacing:.24em;text-transform:uppercase\">avaliar a estadia<\u002Fa>\n            <\u002Fdiv>\n            <p style=\"margin:20px 0 0;text-align:center;font-weight:300;font-size:11.5px;line-height:1.8;color:#4A4E44;font-style:italic;text-wrap:pretty\">Volte sempre. A serra continua aqui.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"min-height:844px;background:#F7F4EE;padding:74px 30px 110px;display:flex;flex-direction:column;animation:auraIn .45s ease both\">\n            <div style=\"text-align:center\">\n              <img src=\"77956e0c-1fa5-4a9f-af79-c10a36075313\" alt=\"PRANA\" style=\"width:58px;height:auto;display:block;margin:0 auto 14px\">\n              <div style=\"font-family:'Poiret One',cursive;font-size:40px;color:#C1571C\">fale com a gente<\u002Fdiv>\n              <p style=\"margin:12px 0 0;font-weight:300;font-size:12.5px;line-height:1.8;color:#8A8578;text-wrap:pretty\">Qualquer dúvida durante a estadia, é só chamar. Respondemos rápido.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"margin-top:28px;display:flex;flex-direction:column;gap:10px\">\n              <a href=\"#\" style=\"background:#EFE9DE;border-radius:100px;padding:15px 24px;display:flex;align-items:center;gap:14px;color:#4A4E44\"><span style=\"width:8px;height:8px;border-radius:50%;background:#96AF95\"><\u002Fspan><span style=\"font-size:12.5px;font-weight:300\">[WhatsApp · +55 __ _____-____]<\u002Fspan><\u002Fa>\n              <a href=\"#\" style=\"background:#EFE9DE;border-radius:100px;padding:15px 24px;display:flex;align-items:center;gap:14px;color:#4A4E44\"><span style=\"width:8px;height:8px;border-radius:50%;background:#C1571C\"><\u002Fspan><span style=\"font-size:12.5px;font-weight:300\">[@prana.experience]<\u002Fspan><\u002Fa>\n              <a href=\"#\" style=\"background:#EFE9DE;border-radius:100px;padding:15px 24px;display:flex;align-items:center;gap:14px;color:#4A4E44\"><span style=\"width:8px;height:8px;border-radius:50%;background:#C4634A\"><\u002Fspan><span style=\"font-size:12.5px;font-weight:300\">[contato@pranaexperience.com]<\u002Fspan><\u002Fa>\n              <a href=\"#\" style=\"background:#EFE9DE;border-radius:100px;padding:15px 24px;display:flex;align-items:center;gap:14px;color:#4A4E44\"><span style=\"width:8px;height:8px;border-radius:50%;background:#CFBB9E\"><\u002Fspan><span style=\"font-size:12.5px;font-weight:300\">[www.pranaexperience.com]<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n            <div style=\"margin-top:auto;padding-top:34px;text-align:center\">\n              <div style=\"font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:#8A8578\">as outras estadias<\u002Fdiv>\n              <div style=\"display:flex;gap:6px;margin-top:12px\">\n                <div style=\"flex:1;background:#C1571C;border-radius:10px;padding:12px 4px;text-align:center\"><div style=\"font-size:7.5px;letter-spacing:.2em;color:rgba(255,255,255,.85)\">casa<\u002Fdiv><div style=\"font-family:'Poiret One',cursive;font-size:15px;color:#fff;letter-spacing:.08em\">PRANA<\u002Fdiv><\u002Fdiv>\n                <div style=\"flex:1;background:#CFBB9E;border-radius:10px;padding:12px 4px;text-align:center\"><div style=\"font-size:7.5px;letter-spacing:.2em;color:rgba(74,78,68,.7)\">domo<\u002Fdiv><div style=\"font-family:'Poiret One',cursive;font-size:15px;color:#fff;letter-spacing:.08em\">OJAS<\u002Fdiv><\u002Fdiv>\n                <div style=\"flex:1;background:#C4634A;border-radius:10px;padding:12px 4px;text-align:center\"><div style=\"font-size:7.5px;letter-spacing:.2em;color:rgba(255,255,255,.85)\">chalé<\u002Fdiv><div style=\"font-family:'Poiret One',cursive;font-size:15px;color:#fff;letter-spacing:.08em\">MANTRA<\u002Fdiv><\u002Fdiv>\n                <div style=\"flex:1;background:#96AF95;border-radius:10px;padding:12px 4px;text-align:center;outline:1.5px solid #6F8B6E;outline-offset:1px\"><div style=\"font-size:7.5px;letter-spacing:.2em;color:rgba(255,255,255,.9)\">cabana<\u002Fdiv><div style=\"font-family:'Poiret One',cursive;font-size:15px;color:#fff;letter-spacing: 6);background:rgba(255,255,255,.16);backdrop-filter:blur(6px);color:#FFFFFF;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center\" style-hover=\"background:#FFFFFF;color:#4A4E44\">←<\u002Fbutton>\n          <div style=\"font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:#FFFFFF\">prana experience · AURA<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ goIndex }}\" style=\"width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.16);backdrop-filter:blur(6px);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px\" style-hover=\"background:#FFFFFF\">\n            <span style=\"width:15px;height:1.4px;background:#FFFFFF;display:block\"><\u002Fspan>\n            <span style=\"width:15px;height:1.4px;background:#FFFFFF;display:block\"><\u002Fspan>\n            <span style=\"width:15px;height:1.4px;background:#FFFFFF;display:block\"><\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:980},&quot;startScreen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cover&quot;,&quot;index&quot;,&quot;host&quot;,&quot;about&quot;,&quot;checkin&quot;,&quot;wifi&quot;,&quot;rules&quot;,&quot;amenities&quot;,&quot;house&quot;,&quot;transport&quot;,&quot;eat&quot;,&quot;explore&quot;,&quot;emergency&quot;,&quot;before&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;cover&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Protótipo&quot;}}\">\nclass Component extends DCLogic {\n  constructor(p){\n    super(p);\n    this.state = { screen: this.props.startScreen || 'cover', history: [] };\n  }\n  go(id){\n    this.setState(s => ({ screen: id, history: [...s.history, s.screen] }));\n  }\n  back(){\n    this.setState(s => s.history.length\n      ? { screen: s.history[s.history.length-1], history: s.history.slice(0,-1) }\n      : { screen: 'index' });\n  }\n  componentDidUpdate(_, prev){\n    if (prev.screen !== this.state.screen) {\n      const sc = document.querySelector('[data-aura-scroll]');\n      if (sc) sc.scrollTop = 0;\n    }\n  }\n  renderVals(){\n    const s = this.state.screen;\n    const mk = id => () => this.go(id);\n    return {\n      isCover: s==='cover', isIndex: s==='index', isHost: s==='host', isAbout: s==='about',\n      isCheckin: s==='checkin', isWifi: s==='wifi', isRules: s==='rules', isAmenities: s==='amenities',\n      isHouse: s==='house', isTransport: s==='transport', isEat: s==='eat', isExplore: s==='explore',\n      isEmergency: s==='emergency', isBefore: s==='before', isContact: s==='contact',\n      showNavLight: s!=='cover' && !['index','wifi','emergency','before'].includes(s),\n      showNavDark: ['index','wifi','emergency','before'].includes(s),\n      goBack: () => this.back(),\n      goIndex: mk('index'), goHost: mk('host'), goAbout: mk('about'), goCheckin: mk('checkin'),\n      goWifi: mk('wifi'), goRules: mk('rules'), goAmenities: mk('amenities'), goHouse: mk('house'),\n      goTransport: mk('transport'), goEat: mk('eat'), goExplore: mk('explore'),\n      goEmergency: mk('emergency'), goBefore: mk('before'), goContact: mk('contact')\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
